<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <title> Bookstore login page</title>
        <link rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    </head>
    <body>
        <div class="container mt-5">
            <div>
                <h1 class="mb-4">Welcome to Bookstore</h1>
            </div>
            <div class="col-md-4">
                <div class="alert alert-danger" th:if="${param.error}">
                    Invalid username and password. 
                
            </div>
            <div class="alert alert-warning" th:if="${param.logout}">
                You have been logged out.
            </div>
            <div >
                <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3"> 
                    <div><label> User Name : <input type="text" name="username" class="form-control"/> </label></div>
                    <div><label> Password: <input type="password" name="password" class="form-control"/> </label></div>
                    <div><input type="submit" value="Sign In" class="btn btn-primary"/></div>
                    <div><a  class="btn btn-link" th:href="@{/login}" >Sign up currently disabled</a></div>
                </form>
            </div>
        </div>
       </div>
    </body>
</html>
